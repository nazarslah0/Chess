name: Build Chess Analyzer APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch: {}

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: 'stable'
          cache: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: sdkmanager "ndk;27.2.12479018"

      - name: Generate Android project
        run: |
          flutter create \
            --platforms=android \
            --org com.chessanalyzer \
            --project-name chess \
            .

      - name: Download Stockfish 19
        run: |
          git clone \
            --depth 1 \
            --branch sf_19 \
            https://github.com/official-stockfish/Stockfish.git \
            stockfish

          cd stockfish

          echo "Stockfish revision:"
          git describe --tags --always
          git rev-parse HEAD

      - name: Build Stockfish 19 ARM64
        run: |
          cd stockfish/src

          make -j2 build \
            ARCH=armv8 \
            COMP=ndk

          echo "Built Stockfish:"
          file stockfish
          ls -lh stockfish

      - name: Prepare Android native library
        run: |
          mkdir -p android/app/src/main/jniLibs/arm64-v8a

          cp stockfish/src/stockfish \
            android/app/src/main/jniLibs/arm64-v8a/libstockfish.so

          chmod 755 \
            android/app/src/main/jniLibs/arm64-v8a/libstockfish.so

          ls -lh \
            android/app/src/main/jniLibs/arm64-v8a/

      - name: Get dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze || true

      - name: Build ARM64 APK
        run: |
          flutter build apk \
            --release \
            --target-platform android-arm64

      - name: Show APK size
        run: |
          ls -lh build/app/outputs/flutter-apk/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: chess-analyzer-arm64-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
