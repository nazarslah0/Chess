name: Build Chess Analyzer APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch: {}

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: 'stable'
          cache: true

      - name: Generate platform folders
        run: flutter create --platforms=android,ios --org com.chessanalyzer --project-name chess .

      - name: Get dependencies
        run: flutter pub get

      - name: Patch legacy jcenter() in stockfish package
        run: |
          echo "PUB_CACHE resolves to: ${PUB_CACHE:-$HOME/.pub-cache}"
          CACHE_ROOT="${PUB_CACHE:-$HOME/.pub-cache}"
          FILES=$(find "$CACHE_ROOT" -path "*stockfish-*" -name "build.gradle*" 2>/dev/null)
          if [ -z "$FILES" ]; then
            echo "::error::No stockfish build.gradle* found under $CACHE_ROOT"
            echo "Listing anything stockfish-related under the cache for debugging:"
            find "$CACHE_ROOT" -iname "*stockfish*" -maxdepth 5 2>/dev/null || true
            exit 1
          fi
          for f in $FILES; do
            echo "Found: $f"
            sed -i 's/jcenter()/mavenCentral()/g' "$f"
            if grep -q "jcenter" "$f"; then
              echo "::error::jcenter() is still present in $f after patching"
              exit 1
            fi
            echo "Successfully patched: $f"
          done

      - name: Static analysis (non-blocking)
        run: flutter analyze || true

      - name: Build a single release APK that installs on any phone
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: chess-analyzer-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
