name: Build Chess Analyzer APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]

  workflow_dispatch: {}

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:

      # ---------------------------------------------------------
      # Checkout
      # ---------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # Flutter
      # ---------------------------------------------------------
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      # ---------------------------------------------------------
      # Java 17
      # ---------------------------------------------------------
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ---------------------------------------------------------
      # Android SDK
      # ---------------------------------------------------------
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      # ---------------------------------------------------------
      # Android NDK
      # ---------------------------------------------------------
      - name: Install Android NDK
        shell: bash
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "ndk;27.2.12479018"

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "NDK:"
          ls -la "$ANDROID_HOME/ndk/27.2.12479018"

      # ---------------------------------------------------------
      # Generate Android project
      # ---------------------------------------------------------
      - name: Generate Android project
        run: |
          flutter create \
            --platforms=android \
            --org com.chessanalyzer \
            --project-name chess \
            .

      # ---------------------------------------------------------
      # Android native bridge
      # ---------------------------------------------------------
      - name: Configure Android native bridge
        shell: bash
        run: |
          mkdir -p android/app/src/main/kotlin/com/chessanalyzer/chess

          cat > android/app/src/main/kotlin/com/chessanalyzer/chess/MainActivity.kt <<'EOF'
          package com.chessanalyzer.chess

          import android.os.Bundle
          import io.flutter.embedding.android.FlutterActivity

          class MainActivity : FlutterActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
              }
          }
          EOF

          echo "MainActivity:"
          cat android/app/src/main/kotlin/com/chessanalyzer/chess/MainActivity.kt

      # ---------------------------------------------------------
      # Download official Stockfish 19
      # ---------------------------------------------------------
      - name: Download Stockfish 19
        shell: bash
        run: |
          rm -rf stockfish

          git clone \
            --depth 1 \
            --branch sf_19 \
            https://github.com/official-stockfish/Stockfish.git \
            stockfish

          cd stockfish

          echo "Stockfish tag:"
          git describe --tags --always

          echo "Stockfish commit:"
          git rev-parse HEAD

      # ---------------------------------------------------------
      # Build Stockfish 19 ARM64
      # ---------------------------------------------------------
      - name: Build Stockfish 19 ARM64
        shell: bash
        run: |
          cd stockfish/src

          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"

          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"

          make -j2 build \
            ARCH=armv8 \
            COMP=ndk

          echo "Stockfish executable:"
          file stockfish

          ls -lh stockfish

      # ---------------------------------------------------------
      # Copy Stockfish into Flutter assets
      # ---------------------------------------------------------
      - name: Prepare Stockfish files
        shell: bash
        run: |
          mkdir -p android/app/src/main/assets/stockfish

          cp \
            stockfish/src/stockfish \
            android/app/src/main/assets/stockfish/stockfish

          chmod 755 \
            android/app/src/main/assets/stockfish/stockfish

          echo "Stockfish APK asset:"
          ls -lh \
            android/app/src/main/assets/stockfish/stockfish

      # ---------------------------------------------------------
      # Flutter dependencies
      # ---------------------------------------------------------
      - name: Get dependencies
        run: flutter pub get

      # ---------------------------------------------------------
      # Flutter doctor
      # ---------------------------------------------------------
      - name: Flutter doctor
        run: flutter doctor -v

      # ---------------------------------------------------------
      # Static analysis
      # ---------------------------------------------------------
      - name: Static analysis
        run: flutter analyze || true

      # ---------------------------------------------------------
      # Build ARM64 APK
      # ---------------------------------------------------------
      - name: Build ARM64 release APK
        run: |
          flutter build apk \
            --release \
            --target-platform android-arm64

      # ---------------------------------------------------------
      # Show APK
      # ---------------------------------------------------------
      - name: Show APK
        shell: bash
        run: |
          echo "APK files:"
          ls -lh build/app/outputs/flutter-apk/

      # ---------------------------------------------------------
      # Upload APK artifact
      # ---------------------------------------------------------
      - name: Upload ARM64 APK
        uses: actions/upload-artifact@v4
        with:
          name: chess-analyzer-arm64-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      # ---------------------------------------------------------
      # GitHub Release
      # ---------------------------------------------------------
      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
