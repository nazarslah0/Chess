name: Build Chess Analyzer Android

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Flutter Android Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter 3.47
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      # The source archive intentionally contains only lib/ and pubspec.yaml.
      # Generate a clean Android host project with the same Flutter toolchain
      # used by CI. This avoids stale Gradle/AGP/Kotlin files from older apps.
      - name: Generate clean Android project
        run: |
          flutter create --platforms=android --org com.chessanalyzer --project-name chess_analyzer .
          echo "android.newDsl=false" >> android/gradle.properties

      - name: Verify project
        run: |
          test -f android/app/build.gradle.kts || test -f android/app/build.gradle
          test -f android/settings.gradle.kts || test -f android/settings.gradle
          test -f pubspec.yaml
          test -d lib

      - name: Get packages
        run: flutter pub get

      - name: Patch Stockfish Android repository
        run: |
          STOCKFISH_GRADLE=$(find "$HOME/.pub-cache/hosted/pub.dev" -path "*/stockfish-1.8.1/android/build.gradle" -print -quit)
          test -n "$STOCKFISH_GRADLE"
          sed -i 's/jcenter()/mavenCentral()/g' "$STOCKFISH_GRADLE"

      - name: Analyze Dart code
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Run tests
        run: flutter test

      - name: Build universal release APK
        run: flutter build apk --release

      - name: Build split APKs
        run: flutter build apk --release --split-per-abi

      - name: Build Android App Bundle
        run: flutter build appbundle --release

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: chess-analyzer-apk
          path: |
            build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: chess-analyzer-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Attach release files for tags
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk
            build/app/outputs/bundle/release/app-release.aab
