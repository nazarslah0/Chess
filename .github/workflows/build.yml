name: Build Chess Analyzer APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch: {}

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: 'stable'
          cache: true

      # This repo ships only Dart source (lib/, pubspec.yaml). The native
      # android/ and ios/ platform folders are generated here instead of
      # being committed, since `flutter create` output is machine/toolchain
      # specific. This does not overwrite lib/ or pubspec.yaml.
      - name: Generate platform folders
        run: flutter create --platforms=android,ios --org com.chessanalyzer --project-name chess .

      - name: Get dependencies
        run: flutter pub get

      # The `stockfish` package's own bundled android/build.gradle still
      # calls the removed jcenter() Gradle repository method, which fails
      # to even parse on the Gradle/AGP version this Flutter release ships.
      # This is a known incompatibility in that package's Android build
      # script (not our Dart code) — patch it in place after fetching it.
      - name: Patch legacy jcenter() in stockfish package
        run: |
          FILE=$(find "$HOME/.pub-cache" -path "*/stockfish-*/android/build.gradle" | head -n1)
          if [ -n "$FILE" ]; then
            sed -i 's/jcenter()/mavenCentral()/g' "$FILE"
            echo "Patched: $FILE"
          else
            echo "::warning::stockfish android/build.gradle not found in pub-cache; skipping patch"
          fi

      - name: Static analysis (non-blocking)
        run: flutter analyze || true

      - name: Build a single release APK that installs on any phone
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: chess-analyzer-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
