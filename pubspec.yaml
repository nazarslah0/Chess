name: chess_analyzer
description: "Chess position analyzer with a real Stockfish engine (no image recognition)."
publish_to: "none"
version: 1.1.0+2

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  # Real, legal chess move generation / FEN / SAN (Dart port of chess.js)
  chess: ^0.8.1
  # Real Stockfish 18 engine bundled as native C++/FFI (Android + iOS)
  # The engine runs on-device; no Stockfish download is required at runtime.
  stockfish: ^1.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
