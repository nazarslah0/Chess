name: chess_analyzer
description: "Chess position analyzer with a real Stockfish engine (no image recognition)."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.9

  # Real, legal chess move generation / FEN / SAN
  chess: ^0.8.1

  # Stockfish engine Flutter package
  # This package currently contains Stockfish 17.
  stockfish_chess_engine: ^0.8.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/pieces/classic/
    - assets/pieces/flat/
    - assets/pieces/wood/
